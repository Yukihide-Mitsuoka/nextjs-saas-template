# CI — Layer 3 (authoritative) quality gate. Calls only canonical `make` targets
# (CLAUDE.md §11) so this file never changes when the stack changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Runtime setup for this stack (corepack first so setup-node can cache pnpm)
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: make setup
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: make setup
      - run: make coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: make setup
      - run: make build
        env:
          # Build-time placeholder only (pk_test of "clerk.example.com$") — real keys
          # come from the runtime environment, never from CI (GR-001).
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k

  doctor:
    # Foundation self-check: metadata invariants (YAML frontmatter intact, no collapsed
    # frontmatter) + guard-hook block/allow tests. Catches the doc/rule regressions that
    # the no-op template Makefile can't. Dependency-free (pure bash).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make doctor

  link-check:
    # Broken relative links in docs are a real defect (docs are the product here).
    # Offline mode: verify local file links resolve; external URLs are not fetched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check links (offline)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "--offline --no-progress ."
          fail: true

  pr-quality:
    # PR hygiene: Conventional Commit title (WF-030) + size guard (GR-020)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Calculate lockfile exclusions
        id: lockfile-stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > "${RUNNER_TEMP}/pr-files.json"
          python3 scripts/pr_size_lockfile_stats.py "${RUNNER_TEMP}/pr-files.json" >> "${GITHUB_OUTPUT}"
      - name: PR size guard (GR-020)
        # ADR-0005 permits only an authenticated, same-repository foundation sync to
        # exceed the hard limit. The script is fail-closed and covered by negative tests.
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
          LOCKFILE_ADDITIONS: ${{ steps.lockfile-stats.outputs.lockfile_additions }}
          LOCKFILE_DELETIONS: ${{ steps.lockfile-stats.outputs.lockfile_deletions }}
          LOCKFILE_FILES: ${{ steps.lockfile-stats.outputs.lockfile_files }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/pr-size-policy.sh
